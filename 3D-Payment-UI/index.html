<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next-Level Spatial Transaction 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

        :root {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --dark: #020617;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
            background-color: var(--dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1200px;
            color: var(--text-main);
            user-select: none; /* Prevent text selection while holding */
        }

        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.3s ease;
            filter: blur(60px);
            opacity: 0.5;
            transform: translate(-50%, -50%);
            will-change: left, top;
        }

        .container {
            width: 620px;
            height: 210px;
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            position: relative;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.6s ease;
            transform-style: preserve-3d;
            will-change: transform;
            touch-action: none; /* Crucial for touch hold without scrolling */
        }

        .container:hover {
            transform: scale(1.05) translateY(-10px) rotateX(4deg);
            box-shadow: 0 50px 120px -20px rgba(16, 185, 129, 0.25),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .left-side {
            width: 240px;
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            border-right: 1px solid var(--glass-border);
            background: linear-gradient(135deg, rgba(255,255,255,0.02), transparent);
        }

        /* 3D Holographic Card Container */
        .bank-card {
            width: 172px;
            height: 110px;
            position: relative;
            z-index: 10;
            transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            will-change: transform;
            --mx: 50%; 
            --my: 50%;
        }

        .container:hover .bank-card {
            transform: translateY(-20px) rotate(-8deg) scale(1.05) translateZ(40px);
        }

        /* The Card Flip Mechanic */
        .container.processing .bank-card,
        .container.processing:hover .bank-card {
            transform: translateY(-20px) rotateY(180deg) scale(1.15) translateZ(40px);
            box-shadow: -20px 40px 60px -10px rgba(0,0,0,0.6);
        }

        .card-front, .card-back {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            backface-visibility: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transform-style: preserve-3d;
        }

        .card-front {
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'),
                        linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
        }

        .card-back {
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'),
                        linear-gradient(135deg, #1e293b 0%, #020617 100%);
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
        }

        /* Dynamic Light Glare */
        .card-front::after, .card-back::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: radial-gradient(
                400px circle at var(--mx) var(--my), 
                rgba(255,255,255,0.15),
                transparent 40%
            );
            z-index: 10;
            pointer-events: none;
        }

        /* Front Elements */
        .chip, .contactless, .card-number, .visa {
            will-change: transform;
            z-index: 2;
        }

        .chip {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 42px;
            height: 30px;
            background: linear-gradient(145deg, #fbbf24, #d97706);
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transform: translateZ(20px);
        }

        .contactless {
            position: absolute;
            top: 22px;
            right: 20px;
            color: #cbd5e1;
            font-size: 16px;
            transform: translateZ(15px) rotate(90deg);
            opacity: 0.8;
            font-weight: 700;
        }

        .card-number {
            position: absolute;
            bottom: 30px;
            left: 20px;
            color: #f8fafc;
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: 600;
            font-family: 'Space Grotesk', monospace;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transform: translateZ(30px);
        }

        .visa {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: #f8fafc;
            font-size: 20px;
            font-weight: 700;
            font-style: italic;
            letter-spacing: -1px;
            transform: translateZ(25px);
        }

        /* Back Elements (Biometric) */
        .mag-stripe {
            position: absolute;
            top: 16px;
            width: 100%;
            height: 24px;
            background: #000;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
        }

        .biometric-mesh {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px dashed var(--primary);
            box-shadow: 0 0 20px var(--primary-glow), inset 0 0 10px var(--primary-glow);
            transform: translateZ(25px);
            animation: pulseMesh 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .biometric-mesh::after {
            content: '';
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            filter: blur(4px);
        }

        @keyframes pulseMesh {
            0%, 100% { transform: translateZ(25px) scale(1) rotate(0deg); opacity: 0.8; }
            50% { transform: translateZ(35px) scale(1.1) rotate(180deg); opacity: 1; }
        }

        .auth-text {
            position: absolute;
            bottom: 16px;
            color: var(--primary);
            font-size: 10px;
            letter-spacing: 3px;
            font-family: 'Space Grotesk', monospace;
            font-weight: 700;
            text-shadow: 0 0 10px var(--primary-glow);
            transform: translateZ(20px);
        }

        /* RIGHT SIDE */
        .right-side {
            flex: 1;
            padding: 0 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            position: relative;
        }

        .new {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            transform: translateZ(20px);
            transition: opacity 0.3s ease;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-sub);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .subtitle span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
        }

        .arrow {
            position: absolute;
            right: 42px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            color: var(--text-main);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            padding: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .container:hover .arrow {
            transform: translateY(-50%) translateX(10px);
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .processing .arrow {
            transform: translateY(-50%) translateX(10px) rotate(90deg) scale(0.8);
            border-radius: 12px;
        }

        /* Progress Bar (Mapped to Hold Interaction) */
        .progress-bar-container {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 0 0 32px 32px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: var(--primary);
            width: 0%;
            box-shadow: 0 0 20px var(--primary);
            will-change: width;
        }

        .success-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), transparent);
            border-radius: 32px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            z-index: -1;
        }

        .success .success-overlay { opacity: 1; }

        .amount {
            position: absolute;
            top: 48%;
            left: 48px;
            font-size: 46px;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            color: var(--primary);
            text-shadow: 0 0 30px var(--primary-glow);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .success .amount {
            opacity: 1;
            transform: translateY(0);
        }

        
        .shockwave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        .success .shockwave {
            animation: explode 1s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; border-width: 8px; }
            100% { transform: translate(-50%, -50%) scale(6); opacity: 0; border-width: 1px; }
        }

        
        .particle, .confetti {
            position: absolute;
            will-change: transform, opacity;
            pointer-events: none;
            z-index: 50;
        }

        .particle {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary);
        }

        @keyframes flyDollar {
            0%   { opacity: 0; transform: scale(0.3) translate3d(0,20px,20px) rotate(-12deg); }
            20%  { opacity: 1; transform: scale(1.2) translate3d(0,-40px,40px) rotate(15deg); }
            100% { opacity: 0; transform: scale(0.8) translate3d(250px,-200px,0) rotate(45deg); }
        }

        .confetti {
            width: 6px;
            height: 12px;
            border-radius: 4px;
            animation: confettiFall 3s linear forwards;
            box-shadow: 0 0 10px currentColor;
        }

        @keyframes confettiFall {
            to { transform: translate3d(0, 400px, 0) rotate(1080deg); opacity: 0; }
        }

        
        .check-ring {
            position: absolute;
            left: 120px;
            top: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            box-shadow: 0 0 30px var(--primary-glow), inset 0 0 20px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            z-index: 40;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .success .check-ring {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            transition-delay: 0.3s;
        }

        .check-ring::after {
            content: "✓";
            font-size: 40px;
            color: var(--primary);
            font-weight: bold;
            text-shadow: 0 0 20px var(--primary);
        }

    </style>
</head>
<body>
    <div class="ambient-glow" id="ambient"></div>
    <div class="container" id="container">
        <div class="shockwave"></div>
        <div class="success-overlay"></div>
        
        <div class="left-side">
            <div class="bank-card" id="card">
                <div class="card-front">
                    <div class="chip"></div>
                    <div class="contactless">)))</div>
                    <div class="card-number">•••• •••• •••• 4242</div>
                    <div class="visa">VISA</div>
                </div>
                <div class="card-back">
                    <div class="mag-stripe"></div>
                    <div class="biometric-mesh"></div>
                    <div class="auth-text">NFC AUTH</div>
                </div>
            </div>
        </div>

        <div class="right-side">
            <div>
                <div class="new" id="status-text">Hold to Send</div>
                <div class="subtitle"><span></span> End-to-end encrypted</div>
            </div>
            <svg viewBox="0 0 24 24" class="arrow" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
            <div class="progress-bar-container">
                <div class="progress" id="progress"></div>
            </div>
            <div class="amount" id="amount">$1,450.00</div>
        </div>
        
        <div class="check-ring"></div>
    </div>

    <script>
        const container = document.getElementById('container');
        const card = document.getElementById('card');
        const amountEl = document.getElementById('amount');
        const ambient = document.getElementById('ambient');
        const progressEl = document.getElementById('progress');
        const statusText = document.getElementById('status-text');

        let stage = 0; 
        let isHolding = false;
        let holdProgress = 0;
        let holdRAF = null;
        let lastTiltTime = 0;

        
        let audioCtx, sweepOsc, sweepGain;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTone(freq, type = 'sine', duration = 100, vol = 0.1) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration/1000);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration/1000);
        }

        function startHoldAudio() {
            initAudio();
            sweepOsc = audioCtx.createOscillator();
            sweepGain = audioCtx.createGain();
            sweepOsc.type = 'triangle';
            sweepOsc.frequency.setValueAtTime(200, audioCtx.currentTime);
            
            sweepOsc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 1.2);
            
            sweepGain.gain.setValueAtTime(0, audioCtx.currentTime);
            sweepGain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.1);
            
            sweepOsc.connect(sweepGain).connect(audioCtx.destination);
            sweepOsc.start();
        }

        function stopHoldAudio() {
            if (sweepGain && audioCtx) {
                sweepGain.gain.cancelScheduledValues(audioCtx.currentTime);
                sweepGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                setTimeout(() => { if(sweepOsc) sweepOsc.stop(); }, 100);
            }
        }

        function triggerHaptic(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        
        const PARTICLE_POOL_SIZE = 25;
        let particlePool = [];
        let poolIndex = 0;

        for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.display = 'none';
            container.appendChild(p);
            particlePool.push(p);
        }

        function launchParticle(x, y) {
            const p = particlePool[poolIndex];
            poolIndex = (poolIndex + 1) % PARTICLE_POOL_SIZE;
            p.textContent = ['$', 'Ξ', '₿'][Math.floor(Math.random() * 3)];
            p.style.left = `${x}px`;
            p.style.top = `${y}px`;
            p.style.animation = 'none';
            p.offsetHeight; 
            p.style.animation = `flyDollar ${1.5 + Math.random()}s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards`;
            p.style.display = 'block';
            setTimeout(() => p.style.display = 'none', 2500);
        }

        function launchConfetti() {
            const colors = ['#10b981', '#34d399', '#0ea5e9', '#8b5cf6'];
            for (let i = 0; i < 40; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = `${Math.random() * 100}%`;
                c.style.top = `${-20 - Math.random() * 40}px`;
                c.style.color = colors[Math.floor(Math.random() * colors.length)];
                c.style.backgroundColor = 'currentColor';
                c.style.animationDuration = `${2 + Math.random() * 1.5}s`;
                c.style.transform = `rotate(${Math.random() * 360}deg)`;
                container.appendChild(c);
                setTimeout(() => c.remove(), 3500);
            }
        }

        function countUpAmount() {
            let count = 0;
            const target = 1450.00;
            const step = target / 20;
            const interval = setInterval(() => {
                count += step;
                if (count >= target) {
                    count = target;
                    clearInterval(interval);
                }
                amountEl.textContent = '$' + count.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            }, 30);
        }

        
        function updateTilt(e) {
            ambient.style.left = `${e.clientX}px`;
            ambient.style.top = `${e.clientY}px`;

            if (stage !== 0) return;
            const now = Date.now();
            if (now - lastTiltTime < 16) return; 
            lastTiltTime = now;

            const rect = container.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            
            const rotX = (y - 0.5) * -16;
            const rotY = (x - 0.5) * 24;
            container.style.transform = `scale(1.05) translateY(-10px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;

            const cardRect = card.getBoundingClientRect();
            const cx = ((e.clientX - cardRect.left) / cardRect.width) * 100;
            const cy = ((e.clientY - cardRect.top) / cardRect.height) * 100;
            card.style.setProperty('--mx', `${cx}%`);
            card.style.setProperty('--my', `${cy}%`);
        }

        let mouseMoveRAF = null;
        document.addEventListener('mousemove', e => {
            if (mouseMoveRAF) cancelAnimationFrame(mouseMoveRAF);
            mouseMoveRAF = requestAnimationFrame(() => updateTilt(e));
        });

        container.addEventListener('mouseleave', () => {
            if (stage === 0) {
                container.style.transform = `scale(1) translateY(0) rotateX(0deg) rotateY(0deg)`;
                card.style.setProperty('--mx', `50%`);
                card.style.setProperty('--my', `50%`);
            }
        });

        
        function startHold(e) {
            if (stage === 2) return;
            stage = 1;
            isHolding = true;
            container.classList.add('processing');
            statusText.textContent = 'Authenticating...';
            
            triggerHaptic([15]);
            startHoldAudio();
            
            if (holdRAF) cancelAnimationFrame(holdRAF);
            holdLoop();
        }

        function holdLoop() {
            if (!isHolding) return;
            
            holdProgress += 1.4;
            progressEl.style.width = `${Math.min(holdProgress, 100)}%`;
            
            
            if (Math.floor(holdProgress) % 20 === 0) triggerHaptic([5]);
            
            if (holdProgress >= 100) {
                executeSuccess();
            } else {
                holdRAF = requestAnimationFrame(holdLoop);
            }
        }

        function cancelHold() {
            if (stage === 1) {
                isHolding = false;
                stage = 0;
                holdProgress = 0;
                container.classList.remove('processing');
                progressEl.style.width = `0%`;
                statusText.textContent = 'Hold to Send';
                stopHoldAudio();
            }
        }

        
        container.addEventListener('mousedown', startHold);
        container.addEventListener('touchstart', startHold, {passive: true});
        
        window.addEventListener('mouseup', cancelHold);
        window.addEventListener('touchend', cancelHold);

        function executeSuccess() {
            isHolding = false;
            stage = 2;
            stopHoldAudio();
            
            container.classList.remove('processing');
            container.classList.add('success');
            statusText.textContent = 'Payment Sent';
            
            
            playTone(440, 'sine', 300, 0.1);    
            setTimeout(() => playTone(554.37, 'sine', 300, 0.1), 100); 
            setTimeout(() => playTone(659.25, 'sine', 500, 0.15), 200); 
            triggerHaptic([30, 50, 30, 50, 50]);

            const leftRect = card.getBoundingClientRect();
            const contRect = container.getBoundingClientRect();
            for (let i = 0; i < 18; i++) {
                setTimeout(() => {
                    launchParticle(leftRect.left - contRect.left + 80, leftRect.top - contRect.top + 50);
                }, i * 30);
            }

            launchConfetti();
            countUpAmount();

            
            setTimeout(() => {
                container.classList.remove('success');
                statusText.textContent = 'Hold to Send';
                amountEl.textContent = '$1,450.00';
                progressEl.style.width = `0%`;
                holdProgress = 0;
                stage = 0;
            }, 4500);
        }
    </script>
</body>
</html>
