<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
           
            --bg: #090e17; 
            --nav-bg: #151b29;
            --accent: #00a8ff; 
            --icon-default: #475569;
            --transition-speed: 0.5s;
        }

        body {
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .navigation {
            position: relative;
            width: 400px;
            height: 70px;
            background: var(--nav-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.05);
        }

        .navigation ul {
            display: flex;
            width: 350px;
            padding: 0;
            margin: 0;
            position: relative;
            z-index: 10;
        }

        .navigation ul li {
            position: relative;
            list-style: none;
            width: 70px;
            height: 70px;
            z-index: 2;
        }

        .navigation ul li a {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            height: 100%;
            text-align: center;
            font-weight: 500;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .icon {
            position: relative;
            display: block;
            line-height: 75px;
            font-size: 1.5em;
            transition: var(--transition-speed) cubic-bezier(0.68, -0.55, 0.265, 1.55);
            color: var(--icon-default);
            z-index: 2;
        }

        .navigation ul li.active a .icon {
            transform: translateY(-34px);
            color: var(--accent);
            
            filter: drop-shadow(0 4px 8px rgba(0, 168, 255, 0.4));
        }

        .text {
            position: absolute;
            color: var(--accent);
            font-weight: 700;
            font-size: 0.65em;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: var(--transition-speed) cubic-bezier(0.68, -0.55, 0.265, 1.55);
            opacity: 0;
            transform: translateY(20px);
        }

        .navigation ul li.active a .text {
            opacity: 1;
            transform: translateY(12px);
        }

        
        .text::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent);
            transition: var(--transition-speed);
        }

        .navigation ul li.active a .text::after {
            transform: translateX(-50%) scale(1);
        }

        
        .indicator {
            position: absolute;
            top: -50%;
            left: 25px;
            width: 70px;
            height: 70px;
            background: var(--bg);
            border-radius: 50%;
            border: 6px solid var(--bg);
            box-sizing: border-box;
           
            transition: transform var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1), 
                        width 0.3s ease, 
                        border-radius 0.3s ease;
            z-index: 1;
        }

        .indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -22px;
            width: 20px;
            height: 20px;
            background: transparent;
            border-top-right-radius: 20px;
            box-shadow: 1px -10px 0 0 var(--bg);
        }

        .indicator::after {
            content: '';
            position: absolute;
            top: 50%;
            right: -22px;
            width: 20px;
            height: 20px;
            background: transparent;
            border-top-left-radius: 20px;
            box-shadow: -1px -10px 0 0 var(--bg);
        }

       
        .indicator.stretch-right {
            width: 100px;
            border-radius: 40px;
        }
        .indicator.stretch-left {
            width: 100px;
            border-radius: 40px;
            transform-origin: right;
        }

        svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <div class="navigation">
        <div class="indicator"></div>
        <ul>
            <li class="list">
                <a href="#">
                    <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span>
                    <span class="text">Home</span>
                </a>
            </li>
            <li class="list">
                <a href="#">
                    <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
                    <span class="text">Profile</span>
                </a>
            </li>
            <li class="list active">
                <a href="#">
                    <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></span>
                    <span class="text">Chat</span>
                </a>
            </li>
            <li class="list">
                <a href="#">
                    <span class="icon"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></span>
                    <span class="text">Likes</span>
                </a>
            </li>
            <li class="list">
                <a href="#">
                    <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>
                    <span class="text">Setup</span>
                </a>
            </li>
        </ul>
    </div>

    <script>
        const list = document.querySelectorAll('.list');
        const indicator = document.querySelector('.indicator');
        let currentIndex = 2; 

        
        indicator.style.transform = `translateX(${currentIndex * 70}px)`;

        function moveIndicator(e) {
            e.preventDefault();
            
            const nextIndex = Array.from(list).indexOf(this);
            if (nextIndex === currentIndex) return;

           
            if (nextIndex > currentIndex) {
                indicator.classList.add('stretch-right');
            } else {
                indicator.classList.add('stretch-left');
                
                indicator.style.transform = `translateX(${nextIndex * 70 - 30}px)`;
            }

            
            setTimeout(() => {
                indicator.style.transform = `translateX(${nextIndex * 70}px)`;
                indicator.classList.remove('stretch-right', 'stretch-left');
            }, 150);

            list.forEach((item) => item.classList.remove('active'));
            this.classList.add('active');
            
            currentIndex = nextIndex;

            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(20);
            }
        }

        list.forEach((item) => item.addEventListener('click', moveIndicator));
    </script>
</body>
</html>
