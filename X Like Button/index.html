<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>X Like Button – Original Style</title>
  <style>
    :root {
      --grey:       #71767b;
      --pink:       #f91880;
      --pink-light: #ff78b9;
      --purple:     #785ef0;
      --yellow:     #ffd700;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      font-family: system-ui, sans-serif;
    }

    .like-container {
      position: relative;
      width:  80px;
      height: 80px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input[type="checkbox"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      z-index: 10;
    }

    
    .heart-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width:  38px;
      height: 38px;
      fill: var(--grey);
      transition: fill 0.18s ease;
      z-index: 2;
    }

    input:checked + .heart-icon {
      fill: var(--pink);
      animation: heart-pop 0.62s cubic-bezier(0.17, 0.89, 0.32, 1.49) forwards;
    }

    
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: none;
      fill: none;
      stroke: var(--pink);
      stroke-width: 0;
      opacity: 0;
      transform: scale(0);
      transform-origin: center;
      pointer-events: none;
    }

    input:checked ~ .burst-layer .ring {
      animation: ring-grow 0.55s ease-out forwards;
    }

    
    .particle {
      opacity: 0;
      transform-origin: center;
    }

    input:checked ~ .burst-layer .particle {
      animation: particle-fly 0.68s ease-out forwards;
    }

    
    @keyframes heart-pop {
      0%   { transform: translate(-50%, -50%) scale(1); }
      15%  { transform: translate(-50%, -50%) scale(1.4); }
      30%  { transform: translate(-50%, -50%) scale(0); }
      45%  { transform: translate(-50%, -50%) scale(0); }
      75%  { transform: translate(-50%, -50%) scale(1.3); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes ring-grow {
      0%   { opacity: 1; stroke-width: 20; transform: scale(0);   stroke: var(--purple); }
      40%  { opacity: 1; stroke-width: 15; transform: scale(1);   stroke: var(--pink);   }
      100% { opacity: 0; stroke-width:  0; transform: scale(1.9); stroke: var(--pink);   }
    }

    @keyframes particle-fly {
      0%   { opacity: 0; transform: scale(0) translate(0, 0); }
      20%  { opacity: 1; transform: scale(1) translate(0, 0); }
      100% { opacity: 0; transform: scale(1) translate(var(--dx), var(--dy)); }
    }

    
    .like-container::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 52px; height: 52px;
      background: rgba(249, 24, 128, 0.14);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.22s cubic-bezier(0.2, 0, 0.1, 1);
      pointer-events: none;
    }

    .like-container:hover::before {
      transform: translate(-50%, -50%) scale(1);
    }

    .like-container:hover .heart-icon {
      fill: var(--pink);
      opacity: 0.85;
    }

    input:checked + .heart-icon:hover {
      opacity: 1;
    }

    
    .burst-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }
  </style>
</head>
<body>

<label class="like-container">
  <input type="checkbox">

  <svg class="heart-icon" viewBox="0 0 24 24">
    <path d="M20.884 13.19c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/>
  </svg>

  <svg class="burst-layer" viewBox="0 0 100 100">
    <circle class="ring" cx="50" cy="50" r="12"/>

    <circle class="particle" cx="50" cy="50" r="2.5" fill="var(--pink)"       style="--dx:  0px; --dy: -38px;"/>
    <circle class="particle" cx="50" cy="50" r="2"   fill="var(--pink-light)" style="--dx: 34px; --dy: -26px;"/>
    <circle class="particle" cx="50" cy="50" r="2.5" fill="var(--purple)"     style="--dx: 36px; --dy:  24px;"/>
    <circle class="particle" cx="50" cy="50" r="1.5" fill="var(--yellow)"     style="--dx:  0px; --dy:  38px;"/>
    <circle class="particle" cx="50" cy="50" r="2.5" fill="var(--pink)"       style="--dx:-34px; --dy:  26px;"/>
    <circle class="particle" cx="50" cy="50" r="2"   fill="var(--purple)"     style="--dx:-36px; --dy: -24px;"/>
  </svg>
</label>

</body>
</html>
